name: Moodle Plugin CI

on: [push, pull_request]

concurrency:
  group: moodle-plugin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:${{ matrix.config.postgres }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:${{ matrix.config.mariadb }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 --silent" --health-interval=10s --health-timeout=5s --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        database: [pgsql, mariadb]
        config:
          - php: '8.1'
            moodle: 'MOODLE_405_STABLE'
            postgres: '17'
            mariadb: '11.4'

          - php: '8.3'
            moodle: 'MOODLE_503_STABLE'
            postgres: '17'
            mariadb: '11.4'

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        path: plugin

    - name: Setup PHP ${{ matrix.config.php }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.config.php }}
        ini-values: max_input_vars=5000
        coverage: none

    - name: Initialise moodle-plugin-ci
      run: |
        composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
        echo $(cd ci/bin; pwd) >> $GITHUB_PATH
        echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
        sudo locale-gen en_AU.UTF-8
        echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

    - name: Install moodle-plugin-ci
      run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
      env:
        DB: ${{ matrix.database }}
        MOODLE_BRANCH: ${{ matrix.config.moodle }}

    - name: PHP Lint
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci phplint

    - name: PHP Mess Detector
      continue-on-error: true
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci phpmd

    - name: Validate Moodle plugin
      uses: EduardoKrausME/moodle-plugin-validate@master
      with:
        plugin: ./plugin

    - name: Check upgrade savepoints
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci savepoints

    - name: Validating
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci validate

    - name: Moodle Code Checker
      if: ${{ !cancelled() }}
      run: >
        moodle-plugin-ci phpcs
        --exclude="Universal.WhiteSpace.CommaSpacing,PSR12.Classes.ClassInstantiation,PSR12.Classes.OpeningBraceSpace,Universal.Lists.DisallowLongListSyntax,PSR2.Methods.FunctionCallSignature,PSR12.ControlStructures.ControlStructureSpacing,Squiz.WhiteSpace.ControlStructureSpacing,PSR2.ControlStructures.SwitchDeclaration,Squiz.Functions.MultiLineFunctionDeclaration,PSR2.Classes.ClassDeclaration,Universal.OOStructures.AlphabeticExtendsImplements,moodle.Commenting.DocblockDescription,NormalizedArrays.Arrays.CommaAfterLast,moodle.Files.LineLength,moodle.Commenting.VariableComment,Squiz.Functions.FunctionDeclarationArgumentSpacing,moodle.Commenting.MissingDocblock"

    - name: PHPUnit tests
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci phpunit --fail-on-warning

    - name: Behat features
      id: behat
      if: ${{ !cancelled() }}
      run: moodle-plugin-ci behat --profile chrome

    - name: Upload Behat Faildump
      if: ${{ failure() && steps.behat.outcome == 'failure' }}
      uses: actions/upload-artifact@v4
      with:
        name: Behat Faildump (${{ matrix.database }}, PHP ${{ matrix.config.php }}, ${{ matrix.config.moodle }})
        path: ${{ github.workspace }}/moodledata/behat_dump
        retention-days: 7
        if-no-files-found: ignore

    - name: Mark cancelled jobs as failed.
      if: ${{ cancelled() }}
      run: exit 1
